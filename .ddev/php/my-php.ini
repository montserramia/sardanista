; Configuració PHP personalitzada per al projecte Sardanista
; DDEV carrega automàticament aquest fitxer

memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_vars = 3000

; Opcache (activat per defecte a DDEV en producció)
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
